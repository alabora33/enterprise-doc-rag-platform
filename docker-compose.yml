services:
  migrate:
    build:
      context: ./backend
    container_name: enterprise_rag_migrate
    command: alembic upgrade head
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: enterprise_rag_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
      
  celery_worker:
    build:
      context: ./backend
    container_name: enterprise_rag_celery_worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: enterprise_rag_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise_rag_postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: enterprise_rag_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: