services:
  backend:
    build:
      context: ./backend
    container_name: enterprise_rag_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/app:/app/app

  postgres:
    image: postgres:16
    container_name: enterprise_rag_postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: enterprise_rag_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: